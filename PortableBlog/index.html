<script>
let state,view='home',adminTab='posts',editId=null,dirty=false;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Blog-Request':'1'},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
function mediaHTML(m){const u='/media/'+m.id;if(m.type.startsWith('image/'))return `<img loading="lazy" src="${u}" alt="${esc(m.name)}">`;if(m.type.startsWith('video/'))return `<video controls preload="metadata" src="${u}"></video>`;if(m.type.startsWith('audio/'))return `<audio controls preload="metadata" src="${u}"></audio>`;return '<div style="padding:35px;text-align:center">📄 文件</div>'}
function published(){return state.posts.filter(p=>p.status==='published')}
function adminEntry(){document.body.classList.remove('public-view');if(state.admin)return go('admin');view='login';$('#main').innerHTML=`<div class="panel" style="max-width:440px;margin:auto"><h2>${state.needs_setup?'设置后台密码':'登录管理后台'}</h2><p class="muted">${state.needs_setup?'首次使用，请设置至少 8 位密码。密码随数据文件夹迁移。':'管理文章、媒体与博客设置。'}</p><form id="login"><label for="password">后台密码</label><input id="password" type="password" minlength="8" maxlength="256" required autocomplete="${state.needs_setup?'new-password':'current-password'}">${state.needs_setup?'<label for="confirm">再次输入密码</label><input id="confirm" type="password" required autocomplete="new-password">':''}<button class="primary" style="margin-top:20px">${state.needs_setup?'创建并进入':'登录'}</button></form><p class="help">仅限本机访问。后台密码用于管理入口，数据文件本身未加密。</p></div>`;$('#login').onsubmit=async e=>{e.preventDefault();const password=$('#password').value;if($('#confirm')&&$('#confirm').value!==password)return notice('两次密码不一致');try{await api(state.needs_setup?'setup':'login',{password});await go('admin')}catch(e){notice(e.message)}};$('#password').focus()}
function renderAdmin(){if(!state.admin)return adminEntry();$('#main').innerHTML=`<div class="toolbar"><h2>博客管理</h2><div class="row"><a href="/api/backup">导出数据备份</a><button onclick="logout()">退出登录</button></div></div><div class="tabs">${[['posts','文章'],['tags','标签管理'],['media','媒体库'],['pages','独立页面'],['settings','类目 / 菜单 / 界面'],['security','密码与迁移']].map(([id,label])=>`<button class="${adminTab===id?'active':''}" onclick="tab('${id}')">${label}</button>`).join('')}</div><div id="admin-content"></div>`;if(adminTab==='posts')postList();if(adminTab==='tags')tagsPage();if(adminTab==='media')mediaLibrary();if(adminTab==='pages')pagesList();if(adminTab==='settings')settingsPage();if(adminTab==='security')securityPage()}
function tab(t){if(dirty&&!confirm('放弃未保存内容？'))return;dirty=false;adminTab=t;renderAdmin()}
async function logout(){if(dirty&&!confirm('放弃未保存内容并退出？'))return;await api('logout',{});dirty=false;await go('home')}
async function deletePost(id){if(!confirm('确定删除这篇文章？附件将保留在媒体库。'))return;try{await api('delete-post',{id});dirty=false;adminTab='posts';await go('admin');notice('文章已删除，媒体文件保留')}catch(e){notice(e.message)}}
function size(n){return n>=1024**2?(n/1024**2).toFixed(1)+' MB':(n/1024).toFixed(1)+' KB'}
async function upload(files,onDone){for(const f of files){if(f.size>1024**3)throw Error(f.name+' 超过 1GB');$('#upload-status').textContent='正在上传 '+f.name+'（'+size(f.size)+'）…';const r=await fetch('/api/upload',{method:'POST',headers:{'X-Blog-Request':'1','X-Filename':encodeURIComponent(f.name)},body:f});const j=await r.json();if(!r.ok)throw Error(j.error);if(onDone)onDone(j.id)}$('#upload-status').textContent='上传完成';notice('文件上传完成')}
function mediaLibrary(){$('#admin-content').innerHTML=`<div class="panel" style="margin-bottom:24px"><label>上传图片、视频、音频或 PDF / TXT<input type="file" id="library-upload" multiple></label><div id="upload-status" class="help">单个文件最大 1GB。视频能否播放取决于浏览器的编码支持，推荐 MP4（H.264/AAC）。</div><p class="help">未关联到已发布文章的文件，仅后台可见。删除正在被文章使用的文件会被阻止。</p></div><div class="grid">${state.media.map(m=>`<div class="panel media-card">${mediaHTML(m)}<div class="name">${esc(m.name)}</div><div class="muted">${size(m.size)} · ${m.created.slice(0,10)}</div><div class="row"><a href="/media/${m.id}" download="${esc(m.name)}">下载</a><button class="danger" onclick="deleteMedia('${m.id}')">删除</button></div></div>`).join('')}</div>`;$('#library-upload').onchange=async e=>{e.target.disabled=true;try{await upload(e.target.files);await refresh();mediaLibrary()}catch(err){notice(err.message);await refresh();mediaLibrary()}}}
async function deleteMedia(id){if(!confirm('永久删除此文件？建议先导出备份。'))return;try{await api('delete-media',{id});await refresh();mediaLibrary()}catch(e){notice(e.message)}}
function settingsPage(){const s=state.settings;$('#admin-content').innerHTML=`<form id="settings-form"><div class="split"><div class="panel"><h3>界面设置</h3><label>博客名称<input id="title" maxlength="300" value="${esc(s.title)}" required></label><label>副标题<input id="tagline" maxlength="300" value="${esc(s.subtitle)}"></label><div class="row"><label>主题色<input type="color" id="accent" value="${s.accent}"></label><label>背景色<input type="color" id="background" value="${s.background}"></label></div><label>博客列表开场语<input id="blog-heading" value="${esc(s.blog_heading||'欢迎来玩。')}"></label><label>页脚文字<input id="footer-text" value="${esc(s.footer_text||'')}"></label><label>每页文章数<input type="number" min="1" max="60" id="page-size" value="${s.page_size||9}" required></label><h3 style="margin-top:28px">类目</h3><p class="help">每行一个类目，调整行序即可排序。删除类目不会删除文章，相关文章会归入“未分类”。</p><textarea id="categories">${esc(s.categories.join('\n'))}</textarea></div><div class="panel"><h3>顶部菜单</h3><p class="help">每行：菜单名称 | 目标<br>目标可用：首页、博客、归档、标签、媒体、“页面:about”或“类目:类目名称”。调整行序即可调整菜单顺序。</p><textarea id="menus" style="min-height:260px">${esc(s.menus.map(m=>m.label+' | '+({home:'首页',blog:'博客',archive:'归档',tags:'标签',media:'媒体'}[m.target]||m.target.replace('category:','类目:').replace('page:','页面:'))).join('\n'))}</textarea><button class="primary" style="margin-top:22px">保存全部设置</button></div></div></form>`;$('#settings-form').oninput=()=>dirty=true;$('#settings-form').onsubmit=async e=>{e.preventDefault();try{const categories=[...new Set($('#categories').value.split('\n').map(x=>x.trim()).filter(Boolean))];const menus=$('#menus').value.split('\n').filter(x=>x.trim()).map(line=>{const i=line.indexOf('|');if(i<0)throw Error('菜单每行需要使用 | 分隔名称与目标');const label=line.slice(0,i).trim(),t=line.slice(i+1).trim();return {label,target:({首页:'home',博客:'blog',归档:'archive',标签:'tags',媒体:'media'}[t]||t.replace(/^类目[:：]/,'category:').replace(/^页面[:：]/,'page:'))}});await api('settings',{title:$('#title').value,subtitle:$('#tagline').value,accent:$('#accent').value,background:$('#background').value,blog_heading:$('#blog-heading').value,footer_text:$('#footer-text').value,page_size:Number($('#page-size').value),categories,menus});dirty=false;await refresh();renderAdmin();notice('设置已保存')}catch(e){notice(e.message)}}}
function securityPage(){$('#admin-content').innerHTML=`<div class="split"><div class="panel"><h3>修改后台密码</h3><form id="password-form"><label>原密码<input id="old-password" type="password" required autocomplete="current-password"></label><label>新密码（至少 8 位）<input id="new-password" type="password" minlength="8" maxlength="256" required autocomplete="new-password"></label><label>再次输入新密码<input id="new-confirm" type="password" required autocomplete="new-password"></label><button class="primary" style="margin-top:20px">修改密码并退出登录</button></form></div><div class="panel"><h3>备份与迁移</h3><p>点击“导出数据备份”，保存包含文章、媒体、设置及密码的 ZIP。备份不包含运行环境。</p><p>换电脑：先关闭启动博客的黑色窗口，再复制整个 PortableBlog 文件夹到另一台 Windows 10/11 64 位电脑，双击 启动博客.bat。</p><p>恢复数据备份：关闭博客，将备份中的 data 文件夹解压到博客根目录，替换前请先另行备份当前 data。若需精确恢复历史版本，先移走现有 data，再放入备份的 data。</p><p class="help">密码保护管理操作，但数据未加密。请保管好文件夹和备份；敏感资料建议放在加密磁盘中。</p><a href="/api/backup">下载数据备份 ZIP</a></div></div>`;$('#password-form').onsubmit=async e=>{e.preventDefault();if($('#new-password').value!==$('#new-confirm').value)return notice('两次新密码不一致');try{await api('password',{old:$('#old-password').value,password:$('#new-password').value});await refresh();adminEntry();notice('密码已修改，请重新登录')}catch(e){notice(e.message)}}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

<script>
// v2: independent pages, permalink navigation, journal pagination and page editing.
let listPage=1,query='',editPageSlug=null;
async function refresh(){state=await api('state');const s=state.settings;document.title=s.title;$('#site-title').textContent=s.title;$('#subtitle').textContent=s.subtitle;$('#footer-brand').textContent=s.title;$('#footer-note').textContent=s.footer_text||'';document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--bg',s.background);$('#admin-button').textContent=state.admin?'进入后台':'管理后台';const menus=[...s.menus];for(const [target,label] of [['archive','时间归档'],['tags','标签']])if(!menus.some(m=>m.target===target))menus.push({target,label});$('#nav').innerHTML=menus.map(m=>`<button class="${view===m.target?'active':''}" data-view="${esc(m.target)}">${esc(m.label)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.view));}
async function go(v){if(dirty&&!confirm('尚有未保存内容，确定离开？'))return;dirty=false;view=v;listPage=1;query='';await refresh();document.body.classList.toggle('public-view',v!=='admin'&&v!=='login');if(v==='admin')renderAdmin();else if(v.startsWith('post:'))article(v.slice(5));else renderPublic();history.replaceState(null,'','#'+encodeURIComponent(v));window.scrollTo(0,0)}
function renderPublic(){if(view==='home')return showPage('home');if(view.startsWith('page:'))return showPage(view.slice(5));if(view==='media'){const media=state.media.filter(x=>published().some(p=>p.attachments.includes(x.id))||state.pages.some(p=>p.status==='published'&&p.attachments.includes(x.id)));$('#main').innerHTML=`<h2 class="journal-intro">影像与收藏</h2><div class="grid">${media.map(m=>`<div class="panel media-card">${mediaHTML(m)}<div class="name">${esc(m.name)}</div><a href="/media/${m.id}" download="${esc(m.name)}">保存文件</a></div>`).join('')}</div>${media.length?'':'<p class="muted">暂无已发布的媒体。</p>'}`;return}if(view==='archive')return renderArchive();if(view==='tags')return renderTags();renderJournal()}
function renderJournal(){const cat=view.startsWith('category:')?view.slice(9):'';const tag=view.startsWith('tag:')?view.slice(4):'';$('#main').innerHTML=`<h1 class="journal-intro">${esc(tag?'标签：'+tag:cat||state.settings.blog_heading||'欢迎来玩。')}</h1><div class="blog-toolbar"><div class="category-links"><button class="${!cat?'active':''}" onclick="go('blog')">全部文章</button>${state.settings.categories.map(c=>`<button data-category="${esc(c)}" class="${c===cat?'active':''}">${esc(c)}</button>`).join('')}</div><label class="tag-filter">按标签<select id="journal-tag"><option value="">全部标签</option>${publicTags().map(t=>`<option value="${esc(t)}" ${t===tag?'selected':''}>${esc(t)}</option>`).join('')}</select></label><button onclick="go('archive')">按时间浏览</button><input id="journal-search" value="${esc(query)}" placeholder="搜索文章…" aria-label="搜索文章"></div><div id="journal-results"></div><div class="contact-strip"><button onclick="go('page:contact')">保持联系</button><hr></div>`;$('#main').querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>go('category:'+b.dataset.category));$('#journal-tag').onchange=e=>go(e.target.value?'tag:'+e.target.value:'blog');$('#journal-search').oninput=e=>{query=e.target.value;listPage=1;journalResults()};journalResults()}
function journalResults(){const cat=view.startsWith('category:')?view.slice(9):'';const tag=view.startsWith('tag:')?view.slice(4):'';const q=query.toLowerCase();const posts=published().filter(p=>(!cat||p.category===cat)&&(!tag||(p.tags||[]).includes(tag))&&(p.title+' '+plainText(p)).toLowerCase().includes(q));const per=state.settings.page_size||9,total=Math.max(1,Math.ceil(posts.length/per));listPage=Math.min(listPage,total);const visible=posts.slice((listPage-1)*per,listPage*per);$('#journal-results').innerHTML=(visible.length?'<div class="journal-grid">'+visible.map(p=>{const cover=p.attachments.map(id=>state.media.find(m=>m.id===id)).find(m=>m&&m.type.startsWith('image/'));return `<article class="journal-card" data-post="${p.id}" tabindex="0" role="link" aria-label="${esc(p.title)}">${cover?`<img loading="lazy" src="/media/${cover.id}" alt="${esc(p.title)}">`:''}<h2>${esc(p.title)}</h2><p>${esc(plainText(p).slice(0,120))}${plainText(p).length>120?'…':''}</p><time datetime="${postDate(p).slice(0,10)}">${postDate(p).slice(0,10)}</time></article>`}).join('')+'</div>':'<div class="empty">还没有文章。去后台写下第一篇记录吧。</div>')+(total>1?`<div class="pagination"><button ${listPage===1?'disabled':''} onclick="changeListPage(-1)">← 上一页</button><span>第 ${listPage} / ${total} 页</span><button ${listPage===total?'disabled':''} onclick="changeListPage(1)">下一页 →</button></div>`:'');$('#journal-results').querySelectorAll('[data-post]').forEach(el=>{el.onclick=()=>go('post:'+el.dataset.post);el.onkeydown=e=>{if(e.key==='Enter')el.click()}})}
function changeListPage(delta){listPage+=delta;journalResults();$('#main').scrollIntoView({behavior:'smooth'})}
function pagesList(){$('#admin-content').innerHTML=`<div class="toolbar"><span class="muted">独立页面用于首页、关于、联系及自定义专题介绍。创建后可在菜单中配置入口。</span><button class="primary" onclick="editPage()">＋ 新建页面</button></div><div class="panel">${state.pages.map(p=>`<div class="listrow"><div class="name"><strong>${esc(p.title)}</strong><div class="muted">标识：${esc(p.slug)} · ${p.status==='published'?'已发布':'草稿'}${p.slug==='home'?' · 站点首页':''}</div></div><button data-preview="${esc(p.slug)}">预览</button><button data-edit="${esc(p.slug)}">编辑</button>${p.slug==='home'?'':`<button class="danger" data-delete="${esc(p.slug)}">删除</button>`}</div>`).join('')}</div>`;$('#admin-content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPage(b.dataset.edit));$('#admin-content').querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>go(b.dataset.preview==='home'?'home':'page:'+b.dataset.preview));$('#admin-content').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deletePage(b.dataset.delete))}
async function deletePage(slug){if(!confirm('删除此页面？引用媒体将保留在媒体库。'))return;try{await api('delete-page',{slug});await refresh();pagesList()}catch(e){notice(e.message)}}
window.addEventListener('hashchange',()=>{let next='home';try{next=decodeURIComponent(location.hash.slice(1))||'home'}catch{}if(next!==view)go(next)});
let initialView='home';try{initialView=decodeURIComponent(location.hash.slice(1))||'home'}catch{}

</script>

<script src="/assets/editor.js"></script>
<script src="/assets/organization.js"></script>
<script>go(initialView).catch(e=>{$('#main').textContent='无法连接本地博客，请确认启动窗口仍在运行。';notice(e.message)});</script>
